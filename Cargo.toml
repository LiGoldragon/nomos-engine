[package]
name = "nomos-engine"
version = "0.16.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LiGoldragon/nomos-engine"
description = "Authority-sealed bootstrap Ethos transformation and Logos archive boundary"
autobins = false
autotests = false

[dependencies]
core-ethos = { git = "https://github.com/LiGoldragon/core-ethos.git", rev = "249ed6ac5b8a3a84fee5884bcb35b929f07e9166" }
core-logos = { git = "https://github.com/LiGoldragon/core-logos.git", rev = "abee4036fbeb58c767ef7dc3489804e2afd5c6e1" }
core-nomos = { git = "https://github.com/LiGoldragon/core-nomos.git", rev = "a5e9aeeed90445a7df57ee1c4fda8e4be761b985" }
sema-translator = { git = "https://github.com/LiGoldragon/sema-translator.git", rev = "bc8410dfe4d449cc0e820a2c5b4d44496ad92acd", default-features = false, features = ["bootstrap"] }
thiserror = "2"

[dev-dependencies]
encoded-name-table = { package = "name-table", git = "https://github.com/LiGoldragon/name-table.git", rev = "a22f48d8040ab9235f3552ad8654ff8e27b8157d" }
signal-sema-translator = { git = "https://github.com/LiGoldragon/signal-sema-translator.git", rev = "3a26cb43f8ce7f9fe85da64d19aa55aa662943ce" }

[[test]]
name = "bootstrap"
path = "tests/bootstrap.rs"

[lints.rust]
unsafe_code = "forbid"
unused = { level = "warn", priority = -1 }
dead_code = "warn"
