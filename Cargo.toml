[package]
name = "nomos-engine"
version = "0.13.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LiGoldragon/nomos-engine"
description = "Stateful native authored-Nomos transformation daemon"
[dependencies]
capsule-content-identity = { package = "content-identity", git = "https://github.com/LiGoldragon/content-identity.git", rev = "896b21e17f31b66d0802bff899b4b60acea9c0f1" }
batch-core-ethos = { package = "core-ethos", git = "https://github.com/LiGoldragon/core-ethos.git", rev = "29237c33798db908bbfe10ef0cffe2c6a28be508" }
batch-core-logos = { package = "core-logos", git = "https://github.com/LiGoldragon/core-logos.git", rev = "c7bd55bb29f7c0e10212571d2b4a2f69aae4b35b" }
batch-core-nomos = { package = "core-nomos", git = "https://github.com/LiGoldragon/core-nomos.git", rev = "1580cac092885bfea6a8cd68d4e04b3a99eaf87d" }
core-ethos = { git = "https://github.com/LiGoldragon/core-ethos.git", rev = "7bb9c5a0a31851641998b26f14326515ca64a7e8" }
core-logos = { git = "https://github.com/LiGoldragon/core-logos.git", rev = "1bb284325d3026a695130967215373fa266629d5" }
core-nomos = { git = "https://github.com/LiGoldragon/core-nomos.git", rev = "6470efc171a2acb652fba7d512f76c26f7a53d82" }
name-table = { git = "https://github.com/LiGoldragon/name-table.git", rev = "50cb4bb53ae2dc4f2516f6912be328ef98ae49f8" }
protos = { git = "https://github.com/LiGoldragon/protos.git", rev = "c85cec6117bfd4c423d952fd54e0c0bb11562f89" }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
rust-logos = { git = "https://github.com/LiGoldragon/rust-logos.git", rev = "f3e4b7846ed032bc644f9a5b10a4ca8f3fb4c593" }
sema-engine = { git = "https://github.com/LiGoldragon/sema-engine.git", rev = "e28c8e6503cf3592f21da9f44371a1b2a6448151" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-nomos = { git = "https://github.com/LiGoldragon/signal-nomos.git", rev = "d5b102c339612e68e357a34792b016af3af5254f" }
signal-sema-translator = { git = "https://github.com/LiGoldragon/signal-sema-translator.git", rev = "51c02c4a7b6f67d9dad095f11986085d7d65785b" }
structural-codec = { git = "https://github.com/LiGoldragon/structural-codec.git", rev = "f47fac132722916912b7071556f69cbbf4026f7f" }
batch-structural-codec = { package = "structural-codec", git = "https://github.com/LiGoldragon/structural-codec.git", rev = "fc6807f4365cde1551bbfe120520aec68245abdb" }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync"] }
[dev-dependencies]
tempfile = "3"
[lints.rust]
unsafe_code = "forbid"
unused = { level = "warn", priority = -1 }
dead_code = "warn"
