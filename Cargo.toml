[package]
name = "nomos-engine"
version = "0.3.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LiGoldragon/nomos-engine"
description = "Stateful native authored-Nomos transformation daemon"
[dependencies]
capsule-content-identity = { package = "content-identity", git = "https://github.com/LiGoldragon/content-identity.git", rev = "896b21e17f31b66d0802bff899b4b60acea9c0f1" }
core-ethos = { git = "https://github.com/LiGoldragon/core-ethos.git", rev = "47c866f101c0e830ecff70451e92f7bdc0ade4e7" }
core-logos = { git = "https://github.com/LiGoldragon/core-logos.git", rev = "141abe23273273d2e4470ce15b42ccf9bc5c8764" }
core-nomos = { git = "https://github.com/LiGoldragon/core-nomos.git", rev = "d47e1e4441b7110051aba0f54eb6dea31c057b4c" }
protos = { git = "https://github.com/LiGoldragon/protos.git", rev = "c85cec6117bfd4c423d952fd54e0c0bb11562f89" }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
sema-engine = { git = "https://github.com/LiGoldragon/sema-engine.git", rev = "7bed5017a6f20ff2c109f693c2dedaaddf52e64d" }
signal-nomos = { git = "https://github.com/LiGoldragon/signal-nomos.git", rev = "40ea24045194542a679b97ae34e53c92c2393480" }
signal-sema-translator = { git = "https://github.com/LiGoldragon/signal-sema-translator.git", rev = "51c02c4a7b6f67d9dad095f11986085d7d65785b" }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync"] }
[dev-dependencies]
name-table = { git = "https://github.com/LiGoldragon/name-table.git", rev = "50cb4bb53ae2dc4f2516f6912be328ef98ae49f8" }
structural-codec = { git = "https://github.com/LiGoldragon/structural-codec.git", rev = "1485c1f8edcb9c988492c6eb0378c10a3599d665" }
tempfile = "3"
[lints.rust]
unsafe_code = "forbid"
unused = { level = "warn", priority = -1 }
dead_code = "warn"
