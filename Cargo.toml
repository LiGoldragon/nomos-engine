[package]
name = "nomos-engine"
version = "0.17.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LiGoldragon/nomos-engine"
description = "Authority-sealed bootstrap Ethos transformation and Logos archive boundary"
autobins = false
autotests = false

[dependencies]
core-ethos = { git = "https://github.com/LiGoldragon/core-ethos.git", rev = "427fd74a8217f557cfabdfe0ff23b784c855bf85" }
core-logos = { git = "https://github.com/LiGoldragon/core-logos.git", rev = "f3655c5ba60d2aec5a6bffa0962eef6b5964ee4e" }
core-nomos = { git = "https://github.com/LiGoldragon/core-nomos.git", rev = "ff675b264e3650afb88291036ec2bdd97292a2e7" }
sema-translator = { git = "https://github.com/LiGoldragon/sema-translator.git", rev = "6b5499c0d25c801b56582fdcd8e021c3293a6d4d", default-features = false, features = ["bootstrap"] }
thiserror = "2"

[dev-dependencies]
encoded-name-table = { package = "name-table", git = "https://github.com/LiGoldragon/name-table.git", rev = "a22f48d8040ab9235f3552ad8654ff8e27b8157d" }
signal-sema-translator = { git = "https://github.com/LiGoldragon/signal-sema-translator.git", rev = "3a26cb43f8ce7f9fe85da64d19aa55aa662943ce" }

[[test]]
name = "bootstrap"
path = "tests/bootstrap.rs"

[lints.rust]
unsafe_code = "forbid"
unused = { level = "warn", priority = -1 }
dead_code = "warn"
